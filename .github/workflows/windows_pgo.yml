# Windows MSVC Profile-Guided Optimization build.
#
# Two phases on a single Windows runner:
#   1. build OrcaSlicer INSTRUMENTED (-DORCA_PGO=generate -> linker /GENPROFILE)
#   2. TRAIN: slice a representative, self-contained project -> emits *.pgc
#   3. MERGE the *.pgc into <exe>.pgd with pgomgr
#   4. build OrcaSlicer OPTIMIZED (-DORCA_PGO=use -DORCA_PGO_DATA=<pgd>)
#
# NOTE: this is MSVC PGO (its own profile format) -- the Linux Clang
# bench/orca-heavy.profdata does NOT apply here; Windows must train its own.
#
# Manual trigger. This is a first version; the marked steps (training command,
# exe/pgd discovery, pgomgr syntax) typically need a couple of CI iterations to
# go green since MSVC PGO + the VS generator are finicky and can't be tested off-Windows.
name: Windows PGO build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "CMake build type"
        default: "Release"
        type: string

permissions:
  contents: read

jobs:
  windows-pgo:
    name: Windows MSVC PGO
    runs-on: ${{ vars.SELF_HOSTED && 'orca-win-server' || 'windows-latest' }}
    env:
      build_type: ${{ github.event.inputs.build_type || 'Release' }}
      # KitCardAMS.3mf carries embedded print/printer settings, so it slices
      # headless with no profile setup -- ideal heavy training input.
      train_model: bench/bench_models/KitCardAMS.3mf
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      # Init the submodules the build needs. Vulkan deps are included because
      # SLIC3R_VULKAN=ON (for the GPU seam-raycast win). Vulkan-Loader carries an
      # OrcaSlicer static-build patch, served from danielwoz/Vulkan-Loader@orca-vulkan-static
      # (see .gitmodules); Vulkan-Headers/glslang are clean Khronos tags.
      - name: Init required submodules
        shell: bash
        run: >
          git submodule update --init
          deps/minhook deps_src/mimalloc bambu_network_oss
          deps_src/Vulkan-Headers deps_src/Vulkan-Loader deps_src/glslang

      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~4.3.0"

      - uses: microsoft/setup-msbuild@v3

      # ---- dependencies: reuse the main CI deps cache; build if missing (slow ~1h) ----
      - name: Restore deps cache
        id: deps_cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/deps/build/OrcaSlicer_dep
          key: windows-cache-orcaslicer_deps-build-${{ hashFiles('deps/**') }}

      - name: Build deps (cache miss)
        if: steps.deps_cache.outputs.cache-hit != 'true'
        run: .\build_release_vs.bat deps

      # ================= Phase 1: instrumented build =================
      - name: Configure (instrument)
        run: >
          cmake -B build -A x64
          -DCMAKE_BUILD_TYPE=${{ env.build_type }}
          -DORCA_TOOLS=ON
          -DSLIC3R_VULKAN=ON
          -DORCA_PGO=generate

      - name: Build (instrument)
        run: cmake --build build --config ${{ env.build_type }} --target ALL_BUILD -- -m

      # Stage a RUNNABLE app (resources/, MESA software-GL, dlls) into build/OrcaSlicer.
      # The build-tree exe alone can't run --slice (missing resources/GL) and exits -1.
      - name: Install (instrument)
        run: cmake --build build --config ${{ env.build_type }} --target install -- -m

      - name: Locate exes + profile dir
        id: exe
        shell: pwsh
        run: |
          # build-tree exe: where the .pgd is baked at link + where *.pgc are written
          $buildexe = Get-ChildItem build/src -Recurse -Include orca-slicer.exe,OrcaSlicer.exe -EA SilentlyContinue |
                      Where-Object { $_.FullName -notmatch 'CMakeFiles' } | Select-Object -First 1
          if (-not $buildexe) { throw "build-tree exe not found under build/src" }
          # installed exe: runnable (bundled resources + MESA); a copy of the instrumented binary
          $instexe = Get-ChildItem build/OrcaSlicer -Recurse -Include orca-slicer.exe,OrcaSlicer.exe -EA SilentlyContinue |
                     Select-Object -First 1
          if (-not $instexe) { $instexe = $buildexe; Write-Host "::warning::installed exe not found; using build exe" }
          "dir=$($buildexe.DirectoryName)"  >> $env:GITHUB_OUTPUT
          "path=$($buildexe.FullName)"      >> $env:GITHUB_OUTPUT
          "runexe=$($instexe.FullName)"     >> $env:GITHUB_OUTPUT
          Write-Host "build exe: $($buildexe.FullName)"
          Write-Host "run exe (installed): $($instexe.FullName)"

      # Diagnose the 'OrcaSlicer.dll not loaded, error=126' that aborts the headless slice:
      # error 126 = a dependency DLL is missing. List co-located DLLs + the app DLL's imports.
      - name: Diagnose app DLL deps (error 126)
        shell: pwsh
        run: |
          $rundir = Split-Path "${{ steps.exe.outputs.runexe }}"
          Write-Host "== DLLs next to the installed exe ($rundir) =="
          Get-ChildItem $rundir -Filter *.dll -EA SilentlyContinue | Select-Object Name | Sort-Object Name | Format-Table -AutoSize
          Write-Host "OrcaSlicer.dll present: $(Test-Path "$rundir\OrcaSlicer.dll")  BambuStudio.dll present: $(Test-Path "$rundir\BambuStudio.dll")"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe -EA SilentlyContinue |
                     Where-Object { $_.FullName -match 'Hostx64\\x64' } | Select-Object -First 1
          $appdll = if (Test-Path "$rundir\OrcaSlicer.dll") { "$rundir\OrcaSlicer.dll" } else { "$rundir\BambuStudio.dll" }
          if ($dumpbin -and (Test-Path $appdll)) {
            Write-Host "== imported DLLs of $appdll =="
            & $dumpbin.FullName /dependents $appdll | Select-String -Pattern '\.dll'
          } else { Write-Host "app DLL or dumpbin not found ($appdll)" }

      # The instrumented app DLL imports pgort140.dll (PGO runtime) + vulkan-1.dll
      # (SLIC3R_VULKAN); neither is co-located on the GPU-less runner -> error 126 ->
      # the app can't start to slice. Stage both next to the exe before training.
      - name: Stage runtime DLLs (pgort140 + vulkan-1)
        shell: pwsh
        run: |
          $rundir = Split-Path "${{ steps.exe.outputs.runexe }}"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -property installationPath
          $pgort = Get-ChildItem "$vs\VC\Tools\MSVC" -Recurse -Filter pgort140.dll -EA SilentlyContinue |
                   Where-Object { $_.FullName -match 'Hostx64\\x64' } | Select-Object -First 1
          if ($pgort) { Copy-Item $pgort.FullName $rundir -Force; Write-Host "staged pgort140.dll" }
          else { Write-Host "::warning::pgort140.dll not found" }
          $vk = Get-ChildItem build,deps,deps_src -Recurse -Filter vulkan-1.dll -EA SilentlyContinue | Select-Object -First 1
          if ($vk) { Copy-Item $vk.FullName $rundir -Force; Write-Host "staged vulkan-1.dll from $($vk.FullName)" }
          else { Write-Host "::warning::vulkan-1.dll not found under build/deps -- loader may be static-imported without a DLL" }
          Write-Host "== staged ==" ; Get-ChildItem $rundir -Filter *.dll | Where-Object { $_.Name -match 'pgort|vulkan' } | Select-Object Name

      # The app needs an OpenGL context (thumbnail rendering) -- on the display-less
      # runner the bundled software GL fails to load and the slice HANGS. Drop a working
      # MESA llvmpipe opengl32.dll (+ its companions) where the launcher looks: <exe>/mesa/.
      - name: Provide software OpenGL (MESA llvmpipe)
        shell: pwsh
        run: |
          $rundir  = Split-Path "${{ steps.exe.outputs.runexe }}"
          $mesadir = Join-Path $rundir "mesa"
          New-Item -ItemType Directory -Force $mesadir | Out-Null
          try {
            $rel = Invoke-RestMethod "https://api.github.com/repos/pal1000/mesa-dist-win/releases/latest" -Headers @{ 'User-Agent'='ci' }
            $asset = $rel.assets | Where-Object { $_.name -match 'release-msvc\.7z$' } | Select-Object -First 1
            Write-Host "mesa asset: $($asset.name)"
            Invoke-WebRequest $asset.browser_download_url -OutFile mesa.7z
            & 'C:\Program Files\7-Zip\7z.exe' x mesa.7z -omesa_x -y | Out-Null
            $gl = Get-ChildItem mesa_x -Recurse -Filter opengl32.dll -EA SilentlyContinue |
                  Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
            if (-not $gl) { $gl = Get-ChildItem mesa_x -Recurse -Filter opengl32.dll -EA SilentlyContinue | Select-Object -First 1 }
            if ($gl) { Copy-Item (Join-Path (Split-Path $gl.FullName) '*.dll') $mesadir -Force }
            Write-Host "mesa/opengl32.dll present: $(Test-Path (Join-Path $mesadir 'opengl32.dll'))"
          } catch { Write-Host "::warning::failed to provision MESA llvmpipe: $_" }

      # ---- Training run (emits *.pgc next to the exe) ----
      # ITERATE: confirm the headless --slice invocation/flags on Windows; add
      # more models for broader coverage. The PGO runtime (pgort140.dll) ships
      # with VS and is on PATH via setup-msbuild.
      - name: Train (slice)
        shell: pwsh
        run: |
          $dir   = "${{ steps.exe.outputs.dir }}"
          $exe   = "${{ steps.exe.outputs.runexe }}"
          $model = "${{ github.workspace }}/${{ env.train_model }}"
          $out   = "${{ github.workspace }}/pgo_out"
          New-Item -ItemType Directory -Force $out | Out-Null
          # orca-slicer.exe is a GUI (WINDOWS-subsystem) app: '&' launches it WITHOUT waiting,
          # so the slice never finished and the PGO runtime never flushed *.pgc. Start-Process
          # and WAIT for exit; WorkingDirectory = exe dir so *.pgc land next to the binary.
          $p = Start-Process -FilePath $exe `
                 -ArgumentList @('--slice','0','--outputdir',$out,$model) `
                 -WorkingDirectory $dir -NoNewWindow -PassThru
          if ($p.WaitForExit(900000)) { Write-Host "slice exit code: $($p.ExitCode)" }
          else { Write-Host "::warning::slice did not exit within 15 min; killing"; $p.Kill() }
          Write-Host "== .pgc in exe dir =="; Get-ChildItem $dir -Filter *.pgc -EA SilentlyContinue | Format-Table Name,Length
          Write-Host "== .pgc anywhere in workspace =="; Get-ChildItem "${{ github.workspace }}" -Recurse -Filter *.pgc -EA SilentlyContinue | Format-Table FullName,Length

      - name: Merge profile (*.pgc -> .pgd)
        shell: pwsh
        run: |
          $dir = "${{ steps.exe.outputs.dir }}"
          $pgd = Get-ChildItem $dir -Filter *.pgd | Select-Object -First 1
          if (-not $pgd) { throw "no .pgd produced by /GENPROFILE link in $dir" }
          $pgcs = Get-ChildItem $dir -Filter *.pgc -EA SilentlyContinue
          if (-not $pgcs) { $pgcs = Get-ChildItem "${{ github.workspace }}" -Recurse -Filter *.pgc -EA SilentlyContinue }
          if (-not $pgcs) { throw "no .pgc training data emitted anywhere (training run produced no profile)" }
          # pgomgr.exe ships with the VC tools but is NOT on PATH -- locate it via vswhere.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath  = & $vswhere -latest -property installationPath
          $pgomgr  = Get-ChildItem "$vsPath\VC\Tools\MSVC" -Recurse -Filter pgomgr.exe |
                     Where-Object { $_.FullName -match 'Hostx64\\x64' } | Select-Object -First 1
          if (-not $pgomgr) { throw "pgomgr.exe not found under $vsPath\VC\Tools\MSVC" }
          Write-Host "pgomgr: $($pgomgr.FullName);  merging $($pgcs.Count) .pgc -> $($pgd.Name)"
          # pgomgr /merge <pgc files...> <pgd file>
          & $pgomgr.FullName /merge @($pgcs.FullName) $pgd.FullName
          if ($LASTEXITCODE -ne 0) { throw "pgomgr /merge failed with exit code $LASTEXITCODE" }
          Copy-Item $pgd.FullName "${{ github.workspace }}/orca-windows.pgd"
          Write-Host "merged profile: $($pgd.FullName)"

      # ================= Phase 2: optimized build =================
      - name: Configure (use profile)
        run: >
          cmake -B build -A x64
          -DCMAKE_BUILD_TYPE=${{ env.build_type }}
          -DORCA_TOOLS=ON
          -DSLIC3R_VULKAN=ON
          -DORCA_PGO=use
          -DORCA_PGO_DATA=${{ github.workspace }}/orca-windows.pgd

      - name: Build (optimized)
        run: cmake --build build --config ${{ env.build_type }} --target ALL_BUILD -- -m

      # ---- artifacts: the trained profile (reusable) + the optimized exe ----
      - name: Upload PGO profile
        uses: actions/upload-artifact@v4
        with:
          name: orca-windows-pgd
          path: orca-windows.pgd

      - name: Upload optimized build
        uses: actions/upload-artifact@v4
        with:
          name: OrcaSlicer_Windows_PGO
          path: ${{ steps.exe.outputs.dir }}/*.exe
